        horizontal_alignment: Right


templates:

  # Variants named "{width}x{height}" win outright in the resolver, so each of
  # these applies to the 128×128 panel only.

  playback:
    variants:
      - name: 128x128
        regions:
          - component: scroller_panel_128x128
            x: "0"
            y: "0"
            width: "display.width"
            height: "display.height"
      - name: 128x64
        regions:
          - component: scroller_panel_128x64
            x: "0"
            y: "0"
            width: "display.width"
            height: "display.height"

  aio:
    variants:
      - name: 128x128
        regions:
          - component: aio_panel_128x128
            x: "0"
            y: "0"
            width: "display.width/2"
            height: "display.height"
        fields:
          - name: visualizer_panel
            type: custom
            x: "display.width/2"
            y: "0"
            width: "display.width/2"
            height: "display.height - 11"
      - name: 128x64
        regions:
          - component: aio_panel_128x64
            x: "0"
            y: "0"
            width: "display.width/2"
            height: "display.height"
        fields:
          - name: visualizer_panel
            type: custom
            x: "display.width/2"
            y: "0"
            width: "display.width/2"
            height: "display.height - 11"


  clock:
    variants:
      - name: 128x128
        regions:
          - component: clock_face_128x128
            x: "0"
            y: "0"
            width: "display.width"
            height: "display.height"
      - name: 128x64
        regions:
          - component: clock_face_128x64
            x: "0"
            y: "0"
            width: "display.width"
            height: "display.height"

  weather_current:
    variants:
      - name: 128x128
        regions:
          - component: weather_current_128x128
            x: "0"
            y: "0"
            width: "display.width"
            height: "display.height"
          - component: weather_astral_128x128
            x: "0"
            y: "0"
            width: "display.width"
            height: "display.height"

