  # Current weather - 40×40 SVG icon left, all data in right column,
  # conditions as a full-width strip at the bottom of the display.
  weather_current_168x144:
    fields:
      # SVG icon - left sector
      - name: weather_icon
        type: weather_icon
        x: "4"
        y: "4"
        width: "34"
        height: "34"
      # Metric rows - 10×10 glyphs, font_5x7 text
      - name: temp_glyph
        type: weather_glyph
        x: "weather_icon.right + 2"
        y: "2"
        width: "10"
        height: "10"
        # fg_color: Cyan
      - name: temperature
        type: label
        x: "temp_glyph.right + 2"
        y: "temp_glyph.top"
        width: "display.width - temp_glyph.right - 2"
        height: "8"
        font: font_5x7
