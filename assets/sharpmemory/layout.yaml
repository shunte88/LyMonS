#
#  assets/sharpmemory/layout.yaml
#
#  LyMonS - SHARP-Memory display override (default 400x240 monochrome)
#  SHARP-Memory display family 400x240, 168×144
#
#  Merged on top of assets/layout.yaml at runtime.
#  Only components/templates that differ from the base are defined here.
#
#  Display geometry:
#    400×240 px, mono
#    SVG icon: 150×150 at (0, 10) - vertically centred ((170-150)/2=10)
#    Right column: x=152, width=148
#    Glyph col x=152, text col x=glyph.right+2
#
#  Right column vertical stack (metric block, 20×20 glyphs, 26px pitch):
#    y=6    temperature        (font_7x13_bold, glyph 20×20)
#    y=32   humidity           (font_7x13_bold, glyph 20×20)
#    y=58   wind               (font_7x13_bold, glyph 20×20)
#    y=84   precipitation      (font_7x13_bold, glyph 20×20)
#    y=84   pressure           (font_7x13_bold, glyph 20×20)
#    y=106  astral block - sunrise/sunset/moonrise/moonset chained at no gap
#    y=154  conditions strip   (font_7x13_bold, full width)
#
#  Moonphase: 42×42 glyph at right edge (x=display.width-46),
#             50px multi-line text centered below glyph.
#

components:

  egg_tracks_400x240:
    fields:
      # combination text is not needed here - move out of bounds
      - name: combination
        type: label
        x: "-10"
        y: "-10"
      - name: artist
        type: label
        x: "2 + display.width/2"
        y: "10"
        width: "display.width/2 - 4"
        height: "28"
        font: font_7x13_bold
        horizontal_alignment: Center
      - name: title
        type: label
        x: "artist.left"
        y: "artist.bottom"
        width: "artist.width"
        height: "artist.height"
        font: font_7x13_bold
        horizontal_alignment: Center
      - name: album
        type: label
        x: "artist.left"
        y: "title.bottom"
        width: "artist.width"
        height: "artist.height"
        font: font_7x13_bold
        horizontal_alignment: Center
      - name: year
        type: label
        x: "artist.left"
        y: "album.bottom"
        width: "artist.width"
        height: "artist.height/2"
        font: font_7x13_bold
        horizontal_alignment: Center
      - name: time
        type: label
        x: "display.width - 45"
        y: "display.height - 14"
        width: "45"
        height: "14"
        font: font_7x13_bold
        horizontal_alignment: Right

  scroller_panel_main:
    fields:
      - name: status_bar
        type: status_bar
        x: "2"
        y: "2"
        width: "parent.width - 4"
        height: "14"
        font: font_7x13
      - name: album_artist
        type: scrolling_text
        x: "status_bar.left"
        y: "status_bar.bottom + 10"
        width: "status_bar.width"
        height: "19"
        font: font_9x18_bold
        scrollable: true
      - name: album
        type: scrolling_text
        x: "album_artist.left"
        y: "album_artist.bottom + 3"
        width: "album_artist.width"
        height: "album_artist.height"
        font: font_9x18_bold
        scrollable: true
      - name: title
        type: scrolling_text
        x: "album_artist.left"
        y: "album.bottom + 3"
        width: "album_artist.width"
        height: "album_artist.height"
        font: font_9x18_bold
        scrollable: true
      - name: artist
        type: scrolling_text
        x: "album_artist.left"
        y: "title.bottom + 3"
        width: "album_artist.width"
        height: "album_artist.height"
        font: font_9x18_bold
        horizontal_alignment: Center
        scrollable: true
      - name: year
        type: scrolling_text
        x: "album_artist.left"
        y: "artist.bottom + 3"
        width: "album_artist.width"
        height: "album_artist.height"
        font: font_9x18_bold
        horizontal_alignment: Center
        scrollable: true
      - name: track_progress_bar
        type: track_progress_bar
        x: "status_bar.left"
        y: "display.height - 22"
        width: "display.width - 4"
        height: "8"
      - name: info_line
        type: info_line
        x: "status_bar.left"
        y: "display.height - 14"
        width: "status_bar.width"
        height: "15"
        font: font_7x13_bold

  scroller_panel_400x240:
