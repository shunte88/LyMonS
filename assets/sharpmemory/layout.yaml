  # Current weather - 140×140 SVG icon left, all data in right column,
  # conditions as a full-width strip at the bottom of the display.
  weather_current_400x240:
    fields:
      - name: weather_icon
        type: weather_icon
        x: "2"
        y: "15"
        width: "130"
        height: "130"
      - name: temp_glyph
        type: weather_glyph
        x: "weather_icon.right + 10"
        y: "16"
        width: "18"
        height: "18"
      - name: temperature
        type: label
        x: "temp_glyph.right + 2"
        y: "temp_glyph.top - 1"
        width: "display.width/3"
        height: "temp_glyph.height"
        font: font_9x18_bold
      - name: precip_glyph
        type: weather_glyph
        x: "temp_glyph.left"
        y: "temp_glyph.bottom"
        width: "temp_glyph.width"
        height: "temp_glyph.height"
      - name: precipitation
        type: label
        x: "temperature.left"
        y: "temp_glyph.bottom"
        width: "display.width/3"
        height: "temp_glyph.height"
        font: font_9x18_bold
      - name: wind_glyph
        type: weather_glyph
        x: "temp_glyph.left"
        y: "precip_glyph.bottom"
        width: "temp_glyph.width"
        height: "temp_glyph.height"
      - name: wind
        type: label
        x: "temperature.left"
        y: "precip_glyph.bottom"
        width: "display.width/3"
        height: "temp_glyph.height"
        font: font_9x18_bold
      - name: humidity_glyph
        type: weather_glyph
        x: "temp_glyph.left"
        y: "wind_glyph.bottom"
        width: "temp_glyph.width"
        height: "temp_glyph.height"
      - name: humidity
        type: label
        x: "temperature.left"
        y: "wind_glyph.bottom"
        width: "display.width/3"
        height: "temp_glyph.height"
        font: font_9x18_bold
      - name: pressure_glyph
        type: weather_glyph
        x: "temp_glyph.left"
        y: "humidity_glyph.bottom"
        width: "temp_glyph.width"
        height: "temp_glyph.height"
      - name: pressure
        type: label
        x: "temperature.left"
        y: "humidity_glyph.bottom"
        width: "display.width/3"
        height: "temp_glyph.height"
        font: font_9x18_bold
      # sun and moon
      - name: sunrise_glyph
        type: weather_glyph
        x: "temp_glyph.left"
        y: "pressure_glyph.bottom + 8"
        width: "temp_glyph.width"
        height: "temp_glyph.height"
      - name: sunrise_text
        type: label
        x: "temperature.left"
        y: "sunrise_glyph.top + 1"
        width: "display.width/4"
        height: "temperature.height"
        font: font_9x18_bold
      - name: sunset_glyph
        type: weather_glyph
        x: "sunrise_text.right + 10"
        y: "sunrise_glyph.top"
        width: "temp_glyph.width"
        height: "temp_glyph.height"
      - name: sunset_text
        type: label
        x: "sunset_glyph.right + 2"
        y: "sunrise_text.top"
        width: "display.width/4"
        height: "temperature.height"
        font: font_9x18_bold
      - name: moonrise_glyph
        type: weather_glyph
        x: "temp_glyph.left"
        y: "sunrise_glyph.bottom + 1"
        width: "temp_glyph.width"
        height: "temp_glyph.height"
      - name: moonrise_text
        type: label
        x: "sunrise_text.left"
        y: "moonrise_glyph.top + 1"
        width: "display.width/4"
        height: "temperature.height"
        font: font_9x18_bold
      - name: moonset_glyph
        type: weather_glyph
        x: "sunset_glyph.left"
        y: "sunset_glyph.bottom + 1"
        width: "temp_glyph.width"
        height: "temp_glyph.height"
      - name: moonset_text
        type: label
        x: "sunset_text.left"
        y: "sunset_text.bottom + 1"
        width: "display.width/4"
        height: "temperature.height"
        font: font_9x18_bold
        
      # Moonphase - multi-line text below
      # glyph will be centered above this text
      - name: moonphase_text
        type: label
        x: "parent.width - 72"
        y: "precip_glyph.top"
        width: "70"
        height: "28"
        font: font_7x13
        horizontal_alignment: Center
      # Moonphase - 42×42 glyph center-justified 
      # with multi-line text below
      - name: moonphase_svg
        type: custom
        x: "moonphase_text.left + 4"
        y: "4"
        width: "68"
        height: "68"
      # Conditions - full-width strip at the bottom of the display
      - name: conditions
        type: label
        x: "2"
        y: "parent.height - 22"
        width: "parent.width - 4"
        height: "22"
        font: font_10x20
        horizontal_alignment: Center
  
