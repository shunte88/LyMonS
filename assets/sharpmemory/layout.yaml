        type: weather_glyph
        x: "temp_glyph.left"
        y: "temp_glyph.bottom + 1"
        width: "10"
        height: "10"
        # fg_color: Cyan
      - name: humidity
        type: label
        x: "temperature.left"
        y: "humidity_glyph.top"
        width: "temperature.width"
        height: "8"
        font: font_5x7
      - name: wind_glyph
        type: weather_glyph
        x: "temp_glyph.left"
        y: "humidity_glyph.bottom + 1"
        width: "10"
        height: "10"
      - name: wind
        type: label
        x: "temperature.left"
        y: "wind_glyph.top"
        width: "temperature.width"
        height: "8"
        font: font_5x7
      - name: precip_glyph
        type: weather_glyph
        x: "temp_glyph.left"
        y: "wind_glyph.bottom + 1"
        width: "10"
        height: "10"
      - name: precipitation
        type: label
        x: "temperature.left"
        y: "precip_glyph.top"
        width: "temperature.width"
        height: "8"
        font: font_5x7
      - name: pressure_glyph
        type: weather_glyph
        x: "temp_glyph.left"
        y: "precip_glyph.bottom + 1"
        width: "10"
        height: "10"
      - name: pressure
        type: label
        x: "temperature.left"
        y: "pressure_glyph.top"
        width: "temperature.width"
        height: "8"
        font: font_5x7
      # Astral block - rows chained with no gap
      - name: sunrise_glyph
        type: weather_glyph
        x: "104"
        y: "temp_glyph.top"
        width: "10"
        height: "10"
      - name: sunrise_text
        type: label
        x: "sunrise_glyph.right + 2"
        y: "sunrise_glyph.top"
        width: "33"
        height: "8"
        font: font_5x7
        horizontal_alignment: Center
      - name: sunset_glyph
