name: Build Raspberry Pi / Orange Pi Release

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:  # Allow manual triggers

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write

jobs:
  build-pi:
    name: Build for Raspberry Pi
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - target: arm-unknown-linux-gnueabihf      # Pi 1 / Zero / Zero W (ARMv6)
            arch: armv6
          - target: armv7-unknown-linux-gnueabihf    # Pi 2/3/4 32-bit (ARMv7)
            arch: armv7
          - target: aarch64-unknown-linux-gnu        # Pi 3/4/5 64-bit
            arch: aarch64

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: ${{ matrix.target }}

    - name: Install cross
      run: cargo install cross --git https://github.com/cross-rs/cross

    - name: Install cross-strip tools
      run: sudo apt-get install -y binutils-arm-linux-gnueabihf binutils-aarch64-linux-gnu

    - name: Cache cargo registry
      uses: actions/cache@v4
      with:
        path: ~/.cargo/registry
        key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

    - name: Cache cargo index
      uses: actions/cache@v4
      with:
        path: ~/.cargo/git
        key: ${{ runner.os }}-cargo-index-${{ hashFiles('**/Cargo.lock') }}

    - name: Cache cargo build
      uses: actions/cache@v4
      with:
        path: target
        key: ${{ runner.os }}-cargo-build-pi-${{ matrix.target }}-${{ hashFiles('**/Cargo.lock') }}

    - name: Cross-compile for ${{ matrix.target }}
      run: ./scripts/cross-compile-pi.sh ${{ matrix.target }}

    - name: Create deployment package
      run: ./scripts/create-pcp-package.sh ${{ matrix.target }}

    - name: Get package info
      id: package_info
      run: |
        # Architecture label comes from the matrix (arm triple -> armv6 label)
        ARCH="${{ matrix.arch }}"
        # Get version from Cargo.toml
        VERSION=$(grep '^version' Cargo.toml | head -1 | sed 's/.*"\(.*\)".*/\1/')
        # Construct package name
        PACKAGE_NAME="lymons-${VERSION}-pcp-${ARCH}.tgz"
        echo "package_name=${PACKAGE_NAME}" >> $GITHUB_OUTPUT
        echo "version=${VERSION}" >> $GITHUB_OUTPUT
        echo "arch=${ARCH}" >> $GITHUB_OUTPUT

    - name: Upload build artifact
      uses: actions/upload-artifact@v4
      with:
        name: lymons-pcp-${{ steps.package_info.outputs.arch }}
        path: lymons-*-pcp-${{ steps.package_info.outputs.arch }}.tgz
        retention-days: 30

    - name: Create release (on tag push)
      if: startsWith(github.ref, 'refs/tags/v')
      uses: softprops/action-gh-release@v1
      with:
        files: lymons-*-pcp-${{ steps.package_info.outputs.arch }}.tgz
        draft: false
        prerelease: false
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-opi:
    name: Build for Orange Pi
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          # Current Orange Pis are all 64-bit: OPi 5 family (RK3588/RK3588S),
          # 3B (RK3566), 4 (RK3399), Zero 3 / Zero 2W (Allwinner H618).  Only
          # the older 32-bit Allwinner boards (Zero, PC, One) use the armv7
          # Raspberry Pi package.
          - target: aarch64-unknown-linux-gnu
            arch: aarch64

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: ${{ matrix.target }}

    - name: Install cross
      run: cargo install cross --git https://github.com/cross-rs/cross

    - name: Install cross-strip tools
      run: sudo apt-get install -y binutils-aarch64-linux-gnu

    - name: Cache cargo registry
      uses: actions/cache@v4
      with:
        path: ~/.cargo/registry
        key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

    - name: Cache cargo index
      uses: actions/cache@v4
      with:
        path: ~/.cargo/git
        key: ${{ runner.os }}-cargo-index-${{ hashFiles('**/Cargo.lock') }}

    - name: Cache cargo build
      uses: actions/cache@v4
      with:
        path: target
        key: ${{ runner.os }}-cargo-build-opi-${{ matrix.target }}-${{ hashFiles('**/Cargo.lock') }}

    - name: Cross-compile for ${{ matrix.target }}
      run: ./scripts/cross-compile-opi.sh ${{ matrix.target }}

    - name: Create deployment package
      run: ./scripts/create-opi-package.sh ${{ matrix.target }}

    - name: Get package info
      id: package_info
      run: |
        ARCH="${{ matrix.arch }}"
        VERSION=$(grep '^version' Cargo.toml | head -1 | sed 's/.*"\(.*\)".*/\1/')
        PACKAGE_NAME="lymons-${VERSION}-opi-${ARCH}.tgz"
        echo "package_name=${PACKAGE_NAME}" >> $GITHUB_OUTPUT
        echo "version=${VERSION}" >> $GITHUB_OUTPUT
        echo "arch=${ARCH}" >> $GITHUB_OUTPUT

    - name: Upload build artifact
      uses: actions/upload-artifact@v4
      with:
        name: lymons-opi-${{ steps.package_info.outputs.arch }}
        path: lymons-*-opi-${{ steps.package_info.outputs.arch }}.tgz
        retention-days: 30

    - name: Create release (on tag push)
      if: startsWith(github.ref, 'refs/tags/v')
      uses: softprops/action-gh-release@v1
      with:
        files: lymons-*-opi-${{ steps.package_info.outputs.arch }}.tgz
        draft: false
        prerelease: false
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-binaries:
    name: Publish to Binaries Branch
    runs-on: ubuntu-latest
    needs: [build-pi, build-opi]
    if: success() && github.event_name == 'push'
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Download armv6 artifact
      uses: actions/download-artifact@v4
      with:
        name: lymons-pcp-armv6
        path: ./artifacts/armv6

    - name: Download armv7 artifact
      uses: actions/download-artifact@v4
      with:
        name: lymons-pcp-armv7
        path: ./artifacts/armv7

    - name: Download aarch64 artifact
      uses: actions/download-artifact@v4
      with:
        name: lymons-pcp-aarch64
        path: ./artifacts/aarch64

    - name: Download Orange Pi aarch64 artifact
      uses: actions/download-artifact@v4
      with:
        name: lymons-opi-aarch64
        path: ./artifacts/opi-aarch64

    - name: Get version
      id: version
      run: |
        VERSION=$(grep '^version' Cargo.toml | head -1 | sed 's/.*"\(.*\)".*/\1/')
        echo "version=${VERSION}" >> $GITHUB_OUTPUT

    - name: Publish to binaries branch
      run: |
        # Configure git with token authentication
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git config url."https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/".insteadOf "https://github.com/"

        # Fetch binaries branch (or create if doesn't exist)
        git fetch origin binaries:binaries 2>/dev/null || git checkout --orphan binaries

        # Switch to binaries branch
        git checkout binaries 2>/dev/null || true

        # Clean working directory but keep .git
        git rm -rf . 2>/dev/null || true

        # Create directory structure
        mkdir -p latest armv6 armv7 aarch64 opi-aarch64

        # Copy armv6 files
        cp artifacts/armv6/lymons-${{ steps.version.outputs.version }}-pcp-armv6.tgz armv6/
        cp artifacts/armv6/lymons-${{ steps.version.outputs.version }}-pcp-armv6.tgz latest/lymons-latest-pcp-armv6.tgz

        # Copy armv7 files
        cp artifacts/armv7/lymons-${{ steps.version.outputs.version }}-pcp-armv7.tgz armv7/
        cp artifacts/armv7/lymons-${{ steps.version.outputs.version }}-pcp-armv7.tgz latest/lymons-latest-pcp-armv7.tgz

        # Copy aarch64 files
        cp artifacts/aarch64/lymons-${{ steps.version.outputs.version }}-pcp-aarch64.tgz aarch64/
        cp artifacts/aarch64/lymons-${{ steps.version.outputs.version }}-pcp-aarch64.tgz latest/lymons-latest-pcp-aarch64.tgz

        # Copy Orange Pi files
        cp artifacts/opi-aarch64/lymons-${{ steps.version.outputs.version }}-opi-aarch64.tgz opi-aarch64/
        cp artifacts/opi-aarch64/lymons-${{ steps.version.outputs.version }}-opi-aarch64.tgz latest/lymons-latest-opi-aarch64.tgz

        # Create README
        cat > README.md << 'EOF'
        # LyMonS Binaries

        Pre-compiled binaries for Raspberry Pi (TinyCore Linux / PiCorePlayer)
        and for the current Rockchip Orange Pi boards (Armbian / Debian).

        ## Download Latest — Raspberry Pi

        - **32-bit (armv6)** - Raspberry Pi 1, 2, 3, Zero: [lymons-latest-pcp-armv6.tgz](latest/lymons-latest-pcp-armv6.tgz)
        - **32-bit (armv7)** - Raspberry Pi 3, 4, Zero 2 W: [lymons-latest-pcp-armv7.tgz](latest/lymons-latest-pcp-armv7.tgz)
        - **64-bit (aarch64)** - Raspberry Pi 4, 5, 400: [lymons-latest-pcp-aarch64.tgz](latest/lymons-latest-pcp-aarch64.tgz)

        ## Download Latest — Orange Pi

        - **64-bit (aarch64)** - Orange Pi 5 family (RK3588), 3B (RK3566), 4 (RK3399): [lymons-latest-opi-aarch64.tgz](latest/lymons-latest-opi-aarch64.tgz)

        Older 32-bit Allwinner Orange Pis (Zero, PC, One) use the `armv7` package above.

        ## Installation

        1. Download the appropriate package for your Pi
        2. Extract: `tar xzf lymons-latest-pcp-*.tgz`
        3. Install: `cd lymons-*-pcp-* && sudo ./install.sh`
        4. Configure: `sudo nano /etc/lymons/lymons.yaml`

        ## Versioned Builds

        See the `armv6/`, `armv7/`, `aarch64/` and `opi-aarch64/` directories for specific versions.

        ---
        *Built automatically by GitHub Actions*
        EOF

        # Add and commit
        git add .
        git commit -m "Update binaries: v${{ steps.version.outputs.version }}"

        # Push to binaries branch
        git push origin binaries

  build-summary:
    name: Build Summary
    runs-on: ubuntu-latest
    needs: [build-pi, build-opi, publish-binaries]
    if: always()
    steps:
    - name: Check build status
      run: |
        if [ "${{ needs.build-pi.result }}" == "success" ] && \
           [ "${{ needs.build-opi.result }}" == "success" ]; then
          echo "✅ All Raspberry Pi and Orange Pi builds completed successfully!"
          if [ "${{ needs.publish-binaries.result }}" == "success" ]; then
            echo "✅ Binaries published to binaries branch!"
          fi
        else
          echo "❌ Some builds failed"
          echo "   Raspberry Pi: ${{ needs.build-pi.result }}"
          echo "   Orange Pi:    ${{ needs.build-opi.result }}"
          exit 1
        fi
